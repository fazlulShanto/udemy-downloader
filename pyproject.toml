[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udemy-downloader"
version = "0.1.0"
description = "A Python library and CLI tool for downloading Udemy courses"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Puyodead1", email = "puyodead1@proton.me"},
]
license = {text = "MIT"}
keywords = ["udemy", "downloader", "education", "courses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "mpegdash",
    "tqdm",
    "requests",
    "python-dotenv",
    "protobuf",
    "webvtt-py",
    "pysrt",
    "m3u8",
    "colorama",
    "yt-dlp",
    "bitstring",
    "unidecode",
    "beautifulsoup4",
    "lxml",
    "six",
    "pathvalidate",
    "coloredlogs",
    "browser_cookie3",
    "demoji",
]

[project.urls]
Homepage = "https://github.com/Puyodead1/udemy-downloader"
Repository = "https://github.com/Puyodead1/udemy-downloader"
Issues = "https://github.com/Puyodead1/udemy-downloader/issues"

[project.scripts]
udemy-downloader = "udemy_downloader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["udemy_downloader*"]

[tool.setuptools.package-data]
udemy_downloader = ["templates/*.html"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
